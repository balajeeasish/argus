[project]
name = "argus"
version = "0.1.0"
description = "Local-first AI code reviewer for pull requests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Balajee Asish Brahmandam" }]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
argus = "argus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["argus"]

[tool.coverage.report]
fail_under = 90
show_missing = true
