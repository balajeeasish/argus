# Dogfood: Argus reviews its own PRs. Needs the ARGUS_API_KEY repo secret.
name: argus-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip silently until the maintainer adds the secret.
      # NOTE: `secrets` is not allowed in a job-level `if` — GitHub rejects
      # the workflow file outright. Step-level `if` is the supported spot.
      - uses: ./
        if: ${{ secrets.ARGUS_API_KEY != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-key: ${{ secrets.ARGUS_API_KEY }}
          guidelines: .argus.yml
